services:
  - type: web
    name: blacklines-website
    repo: https://github.com/kgeorgoudis/blacklines-website
    runtime: static
    buildCommand: chmod a+x build.sh && ./build.sh
    staticPublishPath: public
    envVars:
      - key: DART_SASS_VERSION
        value: 1.97.3
      - key: GO_VERSION
        value: 1.24.2
      - key: HUGO_VERSION
        value: 0.157.0
      - key: NODE_VERSION
        value: 24.13.1
      - key: TZ
        value: Europe/Athens
