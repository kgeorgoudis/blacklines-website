{{ define "main" }}
<article class="post">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        <p class="post-meta">Published {{ .Date.Format "January 2, 2006" }}</p>
    </header>

    {{ if .Params.featured_image }}
    <div class="post-featured-image">
        <img src="{{ .Params.featured_image | relURL }}" alt="{{ .Title }}">
    </div>
    {{ end }}

    <div class="post-content">
        {{ .Content }}
    </div>

    {{ if .Params.tags }}
    <footer class="post-footer">
        <div class="post-tags">
            <strong>Tags:</strong>
            {{ range .Params.tags }}
            <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/">{{ . }}</a>
            {{ end }}
        </div>
    </footer>
    {{ end }}
</article>
{{ end }}
