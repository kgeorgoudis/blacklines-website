<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.description }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ .Site.BaseURL }}" class="logo">{{ .Site.Title }}</a>
            <ul class="nav-menu">
                <li><a href="{{ .Site.BaseURL }}">Home</a></li>
                <li><a href="{{ "/diy/" | relURL }}">DIY</a></li>
                <li><a href="{{ "/sketchnotes/" | relURL }}">Sketchnotes</a></li>
                <li><a href="{{ "/devops/" | relURL }}">DevOps</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
