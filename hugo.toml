baseURL = 'https://www.blacklines.gr/'
languageCode = 'en-us'
title = 'Blacklines - Website'

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"

[params]
  description = 'A portfolio showcasing DIY projects, sketchnotes, and DevOps posts'

  # Blowfish appearance
  colorScheme = "fire"
  defaultAppearance = "auto"    # auto = follow OS dark/light preference

  # Site-wide defaults — avoids needing these in every post's front matter
  showToc = false
  showReadingTime = true
  showWordCount = true
  showBreadcrumbs = true
  showDate = true
  showAuthor = false
  groupByYear = false

[params.homepage]
  layout = "page"
  showRecent = false

[params.author]
  name = "Konstantinos Georgoudis"

[params.social]
  linkedin = "https://www.linkedin.com/in/kgeor/"
  instagram = "https://www.instagram.com/k.georgoudis/"
  substack = "https://kgeor.substack.com/"
  email = "kgeor@blacklines.gr"

[[menu.main]]
name = 'DIY'
url = '/diy/'
weight = 1

[[menu.main]]
name = 'Sketchnotes'
url = '/sketchnotes/'
weight = 2

[[menu.main]]
name = 'DevOps'
url = '/devops/'
weight = 3
