baseURL = 'https://www.blacklines.gr/'
languageCode = 'en-us'
title = 'Blacklines - Portfolio'

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"

[params]
  description = 'A portfolio showcasing DIY projects, sketchnotes, and DevOps posts'

  # Blowfish appearance
  colorScheme = "ocean"
  defaultAppearance = "auto"    # auto = follow OS dark/light preference

  # Site-wide defaults — avoids needing these in every post's front matter
  showToc = false
  showReadingTime = false
  showWordCount = false
  showBreadcrumbs = true
  showDate = true
  showAuthor = false
  groupByYear = false

[params.homepage]
  layout = "page"
  showRecent = false

[params.author]
  name = "Your Name"

[[menu.main]]
name = 'DIY'
url = '/diy/'
weight = 1

[[menu.main]]
name = 'Sketchnotes'
url = '/sketchnotes/'
weight = 2

[[menu.main]]
name = 'DevOps'
url = '/devops/'
weight = 3
