baseURL = '/'
languageCode = 'en-us'
title = 'Blacklines'
theme = 'PaperMod'

[markup.goldmark.renderer]
  unsafe = true

[params]
  defaultTheme = "auto"
  description = "A portfolio showcasing DIY projects, sketchnotes, and DevOps posts"
  author = "Konstantinos Georgoudis"
  mainSections = []

  [params.homeInfoParams]
    Title = "Hi, I'm Konstantinos"
    Content = """
<div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
  <img src="/images/profile.jpeg" alt="Konstantinos Georgoudis" style="width: 140px; height: 140px; object-fit: cover; object-position: center top; border-radius: 50%; flex-shrink: 0;">
  <div style="line-height: 1.8;">
    <div><strong>Konstantinos Georgoudis</strong></div>
    <div>Born 1981</div>
    <div>Athens, Greece</div>
  </div>
</div>

I have always been drawn to how things work, starting with my dad's workbench repairing old TVs, through HVAC systems and early computers, all the way to managing infrastructure and crafting furniture on my balcony. The tools change, but the curiosity stays the same.

This is where I share the three things that keep me busy outside of work hours: woodworking and DIY projects built with my hands, sketchnotes and urban sketches I make with pen and watercolor, and technical writing about DevOps and the systems I work with.
"""

