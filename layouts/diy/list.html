{{ define "main" }}
<div class="diy-container">
  <header class="section-header">
    <h1>DIY & Woodworking Projects</h1>
    <p class="section-description">Handcrafted projects and woodworking creations</p>
  </header>

  <div class="projects-grid">
    {{- range .Pages }}
    <article class="project-card">
      {{- if .Params.images }}
      <div class="project-image">
        <img src="{{ index .Params.images 0 }}" alt="{{ .Title }}" />
      </div>
      {{- else if .Params.featured_image }}
      <div class="project-image">
        <img src="{{ .Params.featured_image }}" alt="{{ .Title }}" />
      </div>
      {{- end }}
      <div class="project-content">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <p class="project-date">{{ .Date.Format "January 2, 2006" }}</p>
        <p class="project-excerpt">{{ .Summary }}</p>
        <a href="{{ .Permalink }}" class="read-more">View Project →</a>
      </div>
    </article>
    {{- end }}
  </div>
</div>

<style>
.diy-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.section-header {
  text-align: center;
  margin-bottom: 3rem;
}

.section-header h1 {
  margin: 0 0 0.5rem 0;
  font-size: 2rem;
}

.section-description {
  font-size: 1.1rem;
  color: var(--secondary);
  margin: 0;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 2rem;
}

.project-card {
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  overflow: hidden;
  background: var(--code-bg);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.project-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.project-image {
  width: 100%;
  height: 200px;
  overflow: hidden;
  background: var(--border);
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.project-content {
  padding: 1.5rem;
}

.project-card h2 {
  margin: 0 0 0.5rem 0;
  font-size: 1.3rem;
}

.project-card h2 a {
  text-decoration: none;
  color: var(--accent);
}

.project-card h2 a:hover {
  text-decoration: underline;
}

.project-date {
  margin: 0.5rem 0;
  font-size: 0.9rem;
  color: var(--tertiary);
}

.project-excerpt {
  line-height: 1.6;
  color: var(--secondary);
  margin: 1rem 0;
}

.read-more {
  text-decoration: none;
  color: var(--accent);
  font-weight: 500;
}

.read-more:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .projects-grid {
    grid-template-columns: 1fr;
  }

  .section-header h1 {
    font-size: 1.5rem;
  }
}
</style>
{{ end }}
