{{ define "main" }}
<article class="post-container">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <span>Published {{ .Date.Format "January 2, 2006" }}</span>
      {{- if .ReadingTime }}
      <span>{{ .ReadingTime }} min read</span>
      {{- end }}
    </p>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <footer class="post-footer">
    {{- if .Params.tags }}
    <div class="post-tags">
      <strong>Tags:</strong>
      {{- range .Params.tags }}
      <a href="/tags/{{ . | urlize }}/">{{ . }}</a>
      {{- end }}
    </div>
    {{- end }}
  </footer>
</article>

<style>
.post-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.post-header {
  margin-bottom: 2rem;
}

.post-header h1 {
  margin: 0 0 0.5rem 0;
  font-size: 2rem;
}

.post-meta {
  margin: 0;
  color: var(--secondary);
  font-size: 0.95rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.post-content {
  line-height: 1.8;
  margin: 2rem 0;
}

.post-content h2 {
  margin: 2rem 0 1rem 0;
  font-size: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5rem;
}

.post-content h3 {
  margin: 1.5rem 0 0.5rem 0;
  font-size: 1.2rem;
}

.post-content p {
  margin: 1rem 0;
}

.post-content code {
  background: var(--code-bg);
  padding: 0.2rem 0.4rem;
  border-radius: 0.3rem;
  font-family: monospace;
  font-size: 0.9em;
}

.post-content pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  padding: 1rem;
  overflow-x: auto;
  margin: 1rem 0;
}

.post-content pre code {
  background: none;
  padding: 0;
}

.post-content ul,
.post-content ol {
  margin: 1rem 0;
  padding-left: 2rem;
}

.post-content li {
  margin: 0.5rem 0;
}

.post-footer {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.post-tags {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.post-tags a {
  padding: 0.3rem 0.6rem;
  background: var(--code-bg);
  border-radius: 0.3rem;
  text-decoration: none;
  color: var(--accent);
  font-size: 0.9rem;
}

.post-tags a:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .post-header h1 {
    font-size: 1.5rem;
  }

  .post-content h2 {
    font-size: 1.3rem;
  }
}
</style>
{{ end }}
