{{ define "main" }}
<div class="devops-container">
  <header class="section-header">
    <h1>DevOps Posts</h1>
    <p class="section-description">Technical articles about infrastructure and deployment</p>
  </header>

  <div class="posts-list">
    {{- range .Pages }}
    <article class="post-preview">
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p class="post-meta">
        <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
        {{- if .ReadingTime }}
        <span class="reading-time">{{ .ReadingTime }} min read</span>
        {{- end }}
      </p>
      <p class="post-excerpt">{{ .Summary }}</p>
      <a href="{{ .Permalink }}" class="read-more">Read Full Post →</a>
    </article>
    {{- end }}
  </div>
</div>

<style>
.devops-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.section-header {
  text-align: center;
  margin-bottom: 3rem;
}

.section-header h1 {
  margin: 0 0 0.5rem 0;
  font-size: 2rem;
}

.section-description {
  font-size: 1.1rem;
  color: var(--secondary);
  margin: 0;
}

.posts-list {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.post-preview {
  padding: 1.5rem;
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  background: var(--code-bg);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.post-preview:hover {
  transform: translateX(4px);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

.post-preview h2 {
  margin: 0 0 0.5rem 0;
  font-size: 1.4rem;
}

.post-preview h2 a {
  text-decoration: none;
  color: var(--accent);
}

.post-preview h2 a:hover {
  text-decoration: underline;
}

.post-meta {
  margin: 0.5rem 0 1rem 0;
  font-size: 0.9rem;
  color: var(--tertiary);
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.post-excerpt {
  margin: 1rem 0;
  line-height: 1.6;
  color: var(--secondary);
}

.read-more {
  display: inline-block;
  text-decoration: none;
  color: var(--accent);
  font-weight: 500;
  margin-top: 0.5rem;
}

.read-more:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .section-header h1 {
    font-size: 1.5rem;
  }

  .post-preview h2 {
    font-size: 1.2rem;
  }
}
</style>
{{ end }}
