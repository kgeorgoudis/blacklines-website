{{- if .Site.Params.social }}
<div class="flex items-center justify-center gap-4 mt-4">
  {{- with .Site.Params.social.linkedin }}
  <a href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile" class="hover:text-primary-500 transition-colors">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.474-2.237-1.67-2.237-.91 0-1.454.613-1.692 1.206-.087.213-.109.51-.109.808v5.792h-3.554v-11.001h3.414v1.516h.05c.477-.9 1.637-1.85 3.37-1.85 2.762 0 4.744 1.808 4.744 5.694l.001 7.641zM5.337 9.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 10.019H3.555V8.451h3.564v11.001zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
    </svg>
  </a>
  {{- end }}

  {{- with .Site.Params.social.instagram }}
  <a href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile" class="hover:text-primary-500 transition-colors">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm6.066 9.645c.183 4.04-2.83 7.544-6.87 7.727-4.04.184-7.544-2.83-7.727-6.87-.184-4.04 2.83-7.544 6.87-7.727 4.04-.184 7.544 2.83 7.727 6.87zm3.671-9.486c0 1.465-1.191 2.656-2.656 2.656s-2.656-1.191-2.656-2.656 1.191-2.656 2.656-2.656 2.656 1.191 2.656 2.656z"/>
    </svg>
  </a>
  {{- end }}

  {{- with .Site.Params.social.substack }}
  <a href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="Substack newsletter" class="hover:text-primary-500 transition-colors">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="6" fill="currentColor"/>
      <rect x="2" y="9" width="20" height="2" fill="currentColor"/>
      <rect x="2" y="12" width="20" height="10" fill="currentColor"/>
    </svg>
  </a>
  {{- end }}

  {{- with .Site.Params.social.email }}
  <a href="mailto:{{ . }}" aria-label="Email contact" class="hover:text-primary-500 transition-colors">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </svg>
  </a>
  {{- end }}
</div>
{{- end }}
